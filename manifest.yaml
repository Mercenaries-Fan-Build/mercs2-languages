# mercs2-language — add a novel, selectable language to Mercenaries 2.
#
# Three halves, one Shipment:
#   1. native_hook  — the selector plugin (forces the language index at mount time)
#   2. place_file   — the plugin's config, beside the module
#   3. add_language — the novel language's base WAD (stringdb + fonts)   ← see WHY
#
# WHY add_language and not place_file: the game builds the mounted filename AND the stringdb key
# from the same language-name string, and a missing base `.\Data\<name>.wad` is a hard exit(1) —
# so a *novel* language needs a new base WAD placed in data/, which no other kind can do
# (`place_file`'s dest set excludes data/; overlays only build `<base>-patch.wad`). The
# `add_language` kind in mercs2_quartermaster does exactly that; this contribution lints clean.
#
# RE + hook contract: notes-on-the-released-game/docs/reverse_engineer/language_asi_hook_contract.md

format: 2

shipment:
  name: mercs2-language
  version: 0.1.0
  target: retail
  authors: [mercs2-fan-build]
  description: Adds a novel, player-selectable language via a native language-selector plugin and a new language WAD.
  license: MIT

contributions:
  # 1 — the selector plugin. At the language-WAD mount (FUN_004bfe20) it forces
  #     *DAT_01176018 to the configured slot, so the game boots into our language
  #     independent of OS-locale. Built against the m2 SDK (see plugin/).
  - kind: native_hook
    target: retail
    plugin: src/mercs2_language.asi
    # EXCLUSIVE on the address — no other plugin may hook the language-WAD mount.
    touches: ["0x004BFE20"]

  # 2 — the plugin's config, written beside the loaded module.
  - kind: place_file
    file: src/mercs2_language.ini
    dest: scripts

  # 3 — the novel language's base WAD, placed in data/ by the `add_language` kind (see WHY above).
  #     `name` is the slot string the plugin selects and the basename the game opens
  #     (`.\Data\polski.wad`). The workshop's Localization page authors `strings`.
  - kind: add_language
    name: polski
    display: Polski
    strings: src/polski.strings
    # fonts: src/polski_fonts/   # only if glyphs fall outside fonts_enext (Cyrillic/CJK)

# The shared SDK layer (m2-sdk.dll, a load-time import of the plugin) is required as the m2-sdk
# Shipment, by SEMVER RANGE — not a byte-exact pin. `^0.4` is `>=0.4.0, <0.5.0`; `qm preflight` and
# `qm link` refuse an installed m2-sdk outside it (M0204). The m2-sdk Shipment's `add_runtime_dll`
# places ONE m2-sdk.dll, shared by every mod that needs it, in the GAME ROOT (not scripts/), because
# pmc_bb loads .asi plugins with a plain LoadLibraryA, which resolves a plugin's own imports from
# the exe directory.
load:
  requires:
    - { shipment: m2-sdk, version: "^0.4" }
