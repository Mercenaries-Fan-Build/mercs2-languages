; mercs2_language.asi — configuration.
; Written by Modkit's language selector; read by the plugin at boot, beside the module.
; Field semantics: notes-on-the-released-game/docs/reverse_engineer/language_asi_hook_contract.md
[language]

; Master switch. false = the plugin loads and no-ops.
enabled = false

; Log the intended slot-repoint + index-force WITHOUT applying them. Leave true until the
; live x32dbg spike confirms the hook fires at the mount frame; then set false.
dry_run = true

; Name-table slot to select (exe index order: english=0 spanish=1 italian=2 french=3
; german=4 japanese=5 english_uk=6 allcaps=7 russian=8). 7 = the unused 'allcaps' slot.
index = 7

; If set, repoint slot[index]'s name to this before mount — i.e. a NOVEL language.
; Must equal the base WAD basename the game opens (.\Data\<name>.wad). Omit to force a
; shipped language by index alone.
name = polski

; Advisory only (font handling): latin | cyrillic | cjk. Latin gets fonts_enext for free.
script = latin
