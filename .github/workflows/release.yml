name: Release

# Publishes the mercs2-language Shipment: the plugin built from plugin/ (mercs2_language.asi) and the
# Shipment zip (<shipment.name>-v<version>.zip) that carries it. The plugin is never committed; this is
# the only place it is built for distribution.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, X.Y.Z (no leading v)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A dispatch releases the default branch's head; a tag push releases the tagged commit.
      # plugin/Makefile includes sdk/sdk.mk and compiles against sdk/m2, so the submodule is needed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0
          submodules: true

      - name: The version and tag this run releases
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "::error::tag v$VERSION already exists. Pick a new version."
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not an X.Y.Z version"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # The qm version comes from .github/qm-version (shared with lint.yml). GitHub's recorded sha256 for
      # the asset is read BEFORE downloading, and the downloaded bytes must match it.
      - name: Install qm (version from .github/qm-version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QM_VERSION="$(tr -d '[:space:]' < .github/qm-version)"
          case "$QM_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::.github/qm-version holds '$QM_VERSION', not a vX.Y.Z qm release tag"; exit 1 ;;
          esac
          repo=Mercenaries-Fan-Build/mercs2-wad-simulator
          asset=qm-linux-x86_64
          want=$(gh api "repos/$repo/releases/tags/$QM_VERSION" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest") \
            || { echo "::error::qm release $QM_VERSION was not found in $repo -- check .github/qm-version"; exit 1; }
          if [ -z "$want" ]; then
            echo "::error::$asset is not in qm $QM_VERSION -- check .github/qm-version"
            exit 1
          fi
          want=${want#sha256:}
          gh release download "$QM_VERSION" --repo "$repo" --pattern "$asset" --output qm
          got=$(sha256sum qm | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::$asset failed verification -- expected $want, got $got"
            exit 1
          fi
          echo "qm $QM_VERSION verified: $got"
          chmod +x qm

      # Only on a dispatch: the first `version:` line is shipment.version (shipment: is the manifest's
      # first block after `format:`). The stamp is committed after every check below has passed.
      - name: Stamp shipment.version in manifest.yaml
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          sed -i "0,/^[[:space:]]*version:/s/^\([[:space:]]*\)version:.*/\1version: $VERSION/" manifest.yaml

      # The manifest at the tag must carry the released version. On a tag push nothing is committed, so a
      # mismatch fails the release rather than being fixed up in the runner. The Shipment name is read
      # from the manifest, never hard-coded.
      - name: manifest.yaml names the Shipment at the released version
        id: m
        run: |
          set -euo pipefail
          want="${{ steps.v.outputs.version }}"
          info="$(./qm manifest-info manifest.yaml)"
          echo "$info"
          name="$(jq -r .name <<< "$info")"
          version="$(jq -r .version <<< "$info")"
          if [ -z "$name" ] || [ "$name" = "null" ]; then
            echo "::error::qm manifest-info reported no shipment.name"
            exit 1
          fi
          if [ "$version" != "$want" ]; then
            echo "::error::the release is $want but manifest.yaml's shipment.version is '$version'. Commit manifest.yaml at $want and tag again, or release through the workflow dispatch."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # src/mercs2_language.asi is built from plugin/, not committed; qm refuses a declared source that
      # does not exist, so it is built before lint.
      - name: Build the plugin ASI
        uses: ./.github/actions/build-asi

      # Refuse to release a Shipment that does not lint. Gated on the exit code, not on printed output.
      - name: Lint the Shipment before releasing it
        run: ./qm lint .

      - name: Package the plugin and the Shipment zip
        id: pkg
        run: |
          set -euo pipefail
          ZIP="dist/${{ steps.m.outputs.name }}-${{ steps.v.outputs.tag }}.zip"
          rm -rf dist
          mkdir -p dist
          cp src/mercs2_language.asi dist/mercs2_language.asi
          zip -r "$ZIP" manifest.yaml src README.md
          # List first, then search the list: piping unzip straight into `grep -q` under pipefail can
          # fail on SIGPIPE when grep exits at the first match.
          MEMBERS="$(unzip -Z1 "$ZIP")"
          for m in manifest.yaml src/mercs2_language.asi src/mercs2_language.ini src/polski.strings; do
            grep -qx "$m" <<< "$MEMBERS" || { echo "::error::$ZIP is missing $m"; exit 1; }
          done
          rm -rf _zipcheck
          mkdir _zipcheck
          unzip -q "$ZIP" src/mercs2_language.asi -d _zipcheck
          cmp _zipcheck/src/mercs2_language.asi dist/mercs2_language.asi
          echo "the Shipment's src/mercs2_language.asi matches dist/mercs2_language.asi"
          unzip -l "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # Only on a dispatch, and only after every check above: commit the stamp to the default branch
      # (when the manifest was not already at this version) and push the tag on that commit.
      - name: Commit the stamp and tag it
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          TAG="${{ steps.v.outputs.tag }}"
          BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- manifest.yaml; then
            echo "manifest.yaml is already at $VERSION; tagging the current commit"
          else
            git add manifest.yaml
            git commit -m "manifest.yaml: version $VERSION for release $TAG"
            git push origin "HEAD:$BRANCH"
          fi
          git tag "$TAG"
          git push origin "$TAG"

      # One step creates the release with both assets attached; nothing is uploaded after it is published.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          gh release create "$TAG" \
            dist/mercs2_language.asi \
            "${{ steps.pkg.outputs.zip }}" \
            --verify-tag --title "$TAG" --generate-notes
