name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # plugin/Makefile includes sdk/sdk.mk and compiles against sdk/m2, so the submodule is needed.
      # actions/checkout rewrites the submodule's git@github.com: URL to HTTPS when no ssh-key is given.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The manifest's native_hook points at src/mercs2_language.asi, which is built from plugin/ rather
      # than committed; qm refuses a declared source that does not exist, so it is built before lint.
      - name: Build the plugin ASI
        uses: ./.github/actions/build-asi

      # The qm version comes from .github/qm-version (shared with release.yml). GitHub's recorded sha256
      # for the asset is read BEFORE downloading, and the downloaded bytes must match it.
      - name: Install qm (version from .github/qm-version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QM_VERSION="$(tr -d '[:space:]' < .github/qm-version)"
          case "$QM_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::.github/qm-version holds '$QM_VERSION', not a vX.Y.Z qm release tag"; exit 1 ;;
          esac
          repo=Mercenaries-Fan-Build/mercs2-wad-simulator
          asset=qm-linux-x86_64
          want=$(gh api "repos/$repo/releases/tags/$QM_VERSION" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest") \
            || { echo "::error::qm release $QM_VERSION was not found in $repo -- check .github/qm-version"; exit 1; }
          if [ -z "$want" ]; then
            echo "::error::$asset is not in qm $QM_VERSION -- check .github/qm-version"
            exit 1
          fi
          want=${want#sha256:}
          gh release download "$QM_VERSION" --repo "$repo" --pattern "$asset" --output qm
          got=$(sha256sum qm | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::$asset failed verification -- expected $want, got $got"
            exit 1
          fi
          echo "qm $QM_VERSION verified: $got"
          chmod +x qm

      # Hermetic: no game install and no retail WADs. Gated on the exit code, not on what gets printed.
      - name: Lint this Shipment
        run: ./qm lint .

      - name: The manifest's name and version
        run: ./qm manifest-info manifest.yaml

      - name: What was checked
        if: always()
        run: ./qm rules
